<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专属报告</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #152032;
  background: #e5eaf5;
  font-synthesis: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button { font: inherit; }
button:focus-visible { outline: 3px solid #3782ff; outline-offset: 3px; }
.report { max-width: 480px; min-height: 100vh; margin: auto; background: #f3f5f9; }
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 0 max(22px, env(safe-area-inset-right)) 54px max(22px, env(safe-area-inset-left));
  color: #fff;
  background: linear-gradient(121deg, #101f78 0%, #143cb8 58%, #2377e8 100%);
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  z-index: -1;
  pointer-events: none;
}
.hero::before {
  inset: 0 0 0 29%;
  background: linear-gradient(114deg, #1443bd 8%, #1150c254 62%, #092d8de0),
    url("../app/thumb-skyline.jpg") center 64% / cover;
  mask-image: linear-gradient(102deg, transparent 3%, #000 67%);
  opacity: .54;
}
.hero::after {
  width: 255px;
  height: 240px;
  top: -116px;
  right: -40px;
  border: 1px solid #fff4;
  border-radius: 52px;
  transform: rotate(39deg);
  box-shadow: 0 0 0 24px #9ed0ff12, 0 0 0 57px #9ed0ff0d, 0 0 0 91px #9ed0ff09;
}
.hero-top { min-height: 69px; padding-top: max(18px, env(safe-area-inset-top)); }
.return-button {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-left: -12px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
}
.return-button[hidden] { display: none; }
.return-button::before {
  content: "";
  width: 10px;
  height: 10px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
}
.hero h1 {
  margin: 0;
  max-width: 100%;
  font-size: clamp(31px, 9.4vw, 44px);
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.hero-house-summary{display:grid;gap:5px;width:fit-content;max-width:100%;margin-top:18px;padding:11px 14px;border:1px solid #ffffff3d;border-radius:12px;background:#071c6480;backdrop-filter:blur(8px)}
.hero-house-summary span{color:#e8f1ff;font-size:13px;line-height:1.45}
.hero-house-summary strong{color:#fff;font-size:19px;line-height:1.25;letter-spacing:.01em}
.author { margin: 12px 0 0; color: #e0eaff; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.content {
  position: relative;
  margin-top: -20px;
  border-radius: 22px 22px 0 0;
  background: #f3f5f9;
  padding: 27px 15px calc(33px + env(safe-area-inset-bottom));
}
.floor + .floor { margin-top: 28px; }
.floor-title {
  width: fit-content;
  position: relative;
  isolation: isolate;
  margin: 0 0 13px 3px;
  font-size: 22px;
  line-height: 1.4;
  font-weight: 780;
  letter-spacing: -.035em;
}
.floor-title::after {
  content: "";
  position: absolute;
  z-index: -1;
  bottom: 1px;
  left: 0;
  width: 43px;
  height: 7px;
  border-radius: 4px;
  background: #b4d2ff;
}
.floor-desc {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 9px;
  color: #314a72;
  background: #e9effb;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.recommendations { display: grid; gap: 9px; }
.more-recommendations { display: grid; gap: 9px; margin-top: 9px; }
.more-recommendations[hidden] { display: none; }
.more-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 44px;
  margin-top: 10px;
  border: 1px solid #d5e2fa;
  border-radius: 9px;
  background: #eaf1ff;
  color: #174ba3;
  font-size: 14px;
  font-weight: 680;
  cursor: pointer;
}
.more-button:active { background: #dce9ff; }
.more-button::after {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
}
.more-button[aria-expanded="true"]::after { transform: translateY(2px) rotate(225deg); }
@media (prefers-reduced-motion: no-preference) {
  .more-recommendations:not([hidden]) { animation: reveal .2s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
}
.recommendation {
  display: grid;
  grid-template-columns: clamp(74px, 25vw, 110px) minmax(0, 1fr);
  gap: 11px;
  padding: 9px;
  align-items: start;
  background: #fff;
  border-radius: 12px;
}
.recommendation[role="link"] { cursor: pointer; }
.recommendation[role="link"]:focus-visible { outline: 2px solid #226ef3; outline-offset: 2px; }
.detail-toast { position: fixed; z-index: 30; left: 50%; bottom: 36px; width: max-content; max-width: calc(100% - 48px); padding: 12px 17px; border-radius: 10px; background: #1a2d47e8; color: #fff; font-size: 13px; line-height: 1.45; text-align: center; transform: translateX(-50%); box-shadow: 0 10px 30px #071c3360; }
.cover { position: relative; overflow: hidden; background: #dde6f4; }
.recommendation .cover { aspect-ratio: 1.08; border-radius: 7px; }
.cover img, .cover video { display: block; width: 100%; height: 100%; object-fit: cover; }
.card-copy { min-width: 0; padding: 2px 0; text-align: left; }
.card-title { margin: 0; font-size: 16px; line-height: 1.38; font-weight: 750; overflow-wrap: anywhere; }
.card-meta, .card-place { margin: 4px 0 0; color: #536174; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
.card-price {
  margin: 6px 0 0;
  color: #b72f35;
  font-size: 22px;
  line-height: 1.05;
  font-weight: 790;
  font-variant-numeric: tabular-nums;
}
.card-price span { margin-left: 2px; font-size: 12px; font-weight: 700; }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 9px; margin-top: 7px; }
.price-row .card-price { margin: 0; }
.unit-price { font-size: 12px; color: #536174; }
.property-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
.property-tag { border-radius: 3px; padding: 2px 5px; font-size: 11px; line-height: 1.4; color: #536174; background: #f2f4f7; }
.community .cover { aspect-ratio: 1.06; }
.community .card-title { font-size: 17px; }
.market-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 7px; margin: 6px 0 0; font-size: 12px; color: #536174; }
.market-price strong { color: #b72f35; font-size: 15px; font-variant-numeric: tabular-nums; }
.market-month { flex-basis: 100%; font-size: 11px; color: #536174; }
.media-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.media-card {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}
.media-card .cover { aspect-ratio: 1.47; }
.media-card:only-child { grid-column: 1 / -1; }
.media-card:only-child .cover { aspect-ratio: 1.95; }
.play {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid #fff8;
  border-radius: 50%;
  background: #0d193eaa;
}
.play::after {
  content: "";
  margin-left: 2px;
  border-block: 6px solid transparent;
  border-left: 10px solid white;
}
.viewer {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  padding: 56px 18px 20px;
  border: 0;
  background: #0b1222f5;
  color: #fff;
}
.viewer[open] { display: grid; place-items: center; }
.viewer-content { text-align: center; }
.viewer-content img, .viewer-content video { display: block; max-width: 100%; max-height: 79vh; border-radius: 8px; }
.viewer-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(100%,480px);margin:14px auto 0;color:#fff;font-size:13px}
.viewer-nav button{min-width:58px;min-height:38px;border:1px solid #ffffff70;border-radius:20px;background:#ffffff1f;color:#fff;font-size:12px}
.viewer-nav button:disabled{opacity:.35}
.viewer-hint{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#ffffffa8;font-size:12px}
.viewer-close {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: #fff3;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
}
.page-error { margin: 14px 0; color: #536174; text-align: center; }
.report.is-unavailable { background: #fff; }
.is-unavailable .hero { padding-bottom: 0; color: #17243a; background: #fff; }
.is-unavailable .hero::before, .is-unavailable .hero::after { display: none; }
.is-unavailable .return-button { color: #17243a; }
.is-unavailable .hero h1, .is-unavailable .author, .is-unavailable .hero-house-summary { display: none !important; }
.is-unavailable .content { display: flex; min-height: calc(100vh - 69px); margin-top: 0; padding: 0 24px 96px; border-radius: 0; background: #fff; align-items: center; justify-content: center; }
.unavailable-state { max-width: 330px; text-align: center; }
.unavailable-icon { display: grid; width: 88px; height: 88px; margin: 0 auto 28px; place-items: center; border-radius: 24px; background: #f1f5fb; color: #90a2b9; }
.unavailable-icon svg { width: 47px; height: 47px; }
.unavailable-state h2 { margin: 0; color: #202d42; font-size: 22px; line-height: 1.4; }
.unavailable-state p { margin: 12px 0 0; color: #7d899b; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="report">
  <header class="hero">
    <div class="hero-top"><button class="return-button" type="button" aria-label="返回" hidden></button></div>
    <h1 id="report-title"></h1>
    <p id="report-advisor" class="author" hidden></p>
    <div id="hero-house-summary" class="hero-house-summary" hidden></div>
  </header>
  <main id="report-content" class="content"></main>
</div>
<div id="detail-toast" class="detail-toast" role="status" hidden></div>
<dialog id="viewer" class="viewer" aria-label="查看素材">
  <button class="viewer-close" type="button" aria-label="关闭">×</button>
  <div class="viewer-content"></div>
  <div class="viewer-nav"><button id="viewer-prev" type="button">上一条</button><span id="viewer-count"></span><button id="viewer-next" type="button">下一条</button></div>
  <div id="viewer-hint" class="viewer-hint"></div>
</dialog>
<script src="../report-shared.js"></script>
<script>
const params = new URLSearchParams(location.search);
if(params.get('disabled')==='1')document.body.dataset.snapshotDisabled='1';
const disabledAssetRefs=new Set((params.get('disabledAssets')||'').split(',').filter(Boolean));
const isMediaDisabled=ref=>!!ref&&(disabledAssetRefs.has(ref)||ReportPrototype.isDisabled(ref));
const floors = {
  房源: { id: 'houses', title: '房源推荐' },
  图片: { id: 'images', title: '实景照片' },
  视频: { id: 'videos', title: '实拍视频' }
};
const demo = {
  房源: [
    { ...ReportPrototype.houseExamples['101140402577'], title: '御锦城三房 · 南北通透', cover: 'thumb-living.jpg', room: 3, area: 94.06, price: 108, community: '御锦城', district: '浐灞国际港', block: '浐河西路', source: '贝壳' },
    { ...ReportPrototype.houseExamples.S4624826410476559, title: '保利心语花园 · 南北通透', cover: 'thumb-skyline.jpg', room: 3, area: 112, price: 156, community: '保利心语花园', district: '雁塔区', block: '曲江', source: '安居客' },
    { ...ReportPrototype.houseExamples['101139343423'], title: '金地湖城大境 · 四室', cover: 'thumb-video.jpg', room: 4, area: 136, price: 218, community: '金地湖城大境', district: '雁塔区', block: '曲江', source: '贝壳' },
    { ...ReportPrototype.houseExamples.S8624826410476521, title: '龙湖香醍国际 · 三室', cover: 'thumb-community.jpg', room: 3, area: 128, price: 188, community: '龙湖香醍国际', district: '灞桥区', block: '浐灞', source: '安居客' }
  ],
  图片: [
    { title: '室内实景', cover: 'thumb-living.jpg', assetRef: 'asset-1' },
    { title: '小区环境', cover: 'thumb-community.jpg', assetRef: 'asset-5' },
    { title: '周边街景', cover: 'thumb-skyline.jpg', assetRef: 'asset-photo-3' },
    { title: '公共空间', cover: 'thumb-video.jpg', assetRef: 'asset-photo-4' }
  ],
  视频: [
    { title: '看房实拍', cover: 'thumb-video.jpg', assetRef: 'asset-2' },
    { title: '小区实拍', cover: 'thumb-community.jpg', assetRef: 'asset-video-2' }
  ]
};
const demoDescriptions = {
  房源: '按您关注的户型，整理了几套不同面积和总价的备选。',
};
const sampleReports = {
  R001: { title: '周末看房实景照片', advisorName:'张顾问', order: ['图片'], items: { 图片: demo.图片.slice(0, 2) }, descriptions: { 图片: '整理了看房当天拍摄的室内与周边照片。' } },
  R002: { title: '西安三房看房参考', advisorName:'王顾问', order: ['房源', '图片', '视频'], items: { 房源: demo.房源.slice(0, 2), 图片: demo.图片.slice(0, 2), 视频: demo.视频.slice(0, 1) }, descriptions: demoDescriptions },
  R003: { title: '周末现场讲解视频', advisorName:'张顾问', order: ['视频'], items: { 视频: demo.视频.slice(0, 2) }, descriptions: { 视频: '两段现场实拍，方便您先了解空间与周边。' } }
};
const sampleReport = sampleReports[params.get('sample')];
const fromReport = ['items', 'covers', 'details', 'descs'].some(key => params.has(key));
const reportOrder = sampleReport ? sampleReport.order : params.has('components')
  ? [...new Set(params.get('components').split(',').filter(kind => ['房源', '图片', '视频'].includes(kind)))]
  : ['房源', '图片', '视频'];

function readObject(key) {
  try { return JSON.parse(params.get(key)) || {}; }
  catch { return {}; }
}

const titles = readObject('items');
const moduleTitles = readObject('moduleTitles');
const covers = readObject('covers');
const details = readObject('details');
const descriptions = sampleReport ? sampleReport.descriptions : fromReport ? readObject('descs') : demoDescriptions;
const main = document.getElementById('report-content');

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text) element.textContent = text;
  return element;
}

function fileUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  if (/^(blob:|https?:|data:)/.test(value)) return value;
  return '../app/' + value;
}

function buildCover(item, kind) {
  const cover = node('div', 'cover');
  const url = fileUrl(item.cover);
  if (url) {
    const isLocalVideo = kind === '视频' && url.startsWith('blob:');
    const thumbnail = node(isLocalVideo ? 'video' : 'img');
    thumbnail.src = url;
    if (isLocalVideo) {
      thumbnail.muted = true;
      thumbnail.preload = 'metadata';
      thumbnail.playsInline = true;
      thumbnail.setAttribute('aria-hidden', 'true');
    } else {
      thumbnail.alt = '';
      thumbnail.addEventListener('error', () => thumbnail.remove(), { once: true });
    }
    cover.append(thumbnail);
  }
  return cover;
}

function addLine(parent, className, values) {
  const line = values.filter(Boolean).join(' · ');
  if (line) parent.append(node('p', className, line));
}

const priceFormatter = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 });

function addPropertyPrices(copy, item) {
  const prices = node('div', 'price-row');
  if (Number(item.price) > 0) {
    const total = node('p', 'card-price', String(item.price));
    total.append(node('span', '', '万'));
    prices.append(total);
  }
  const unitPrice = Number(item.unitPrice) > 0 ? Number(item.unitPrice)
    : Number(item.price) > 0 && Number(item.area) > 0 ? Number(item.price) * 10000 / Number(item.area) : 0;
  if (unitPrice > 0) prices.append(node('span', 'unit-price', priceFormatter.format(unitPrice) + ' 元/㎡'));
  if (prices.childElementCount) copy.append(prices);
}

function addMarketPrice(copy, item) {
  const month = /^(\d{4})-(0[1-9]|1[0-2])$/.exec(item.listingMonth || '');
  if (!month || !(Number(item.listingAverage) > 0)) return;
  const market = node('p', 'market-price');
  market.append(
    node('span', '', '挂牌均价'),
    node('strong', '', priceFormatter.format(Number(item.listingAverage)) + '元/㎡'),
    node('span', 'market-month', '（' + month[1].slice(-2) + '年' + month[2] + '月数据）')
  );
  copy.append(market);
}

function addPropertyTags(copy, item) {
  const tags = node('div', 'property-tags');
  const unique = new Set();
  const features = Array.isArray(item.features) ? item.features : String(item.features || '').split(/[,，、]/);
  for (const value of features) {
    const label = typeof value === 'string' ? value.trim() : '';
    if (!label || unique.has(label)) continue;
    unique.add(label);
    tags.append(node('span', 'property-tag', label));
    if (unique.size === 3) break;
  }
  if (tags.childElementCount) copy.append(tags);
}

function recommendation(kind, item) {
  const isHouse = kind === '房源';
  const card = node('article', isHouse ? 'recommendation' : 'recommendation community');
  const copy = node('div', 'card-copy');
  const legacyKey = isHouse && item.title.includes('|');
  const title = legacyKey ? (item.community || '房源信息') : item.title;
  copy.append(node('h3', 'card-title', title));

  if (isHouse) {
    addLine(copy, 'card-meta', [item.room ? item.room + '室' : '', item.area ? item.area + '㎡' : '']);
    addLine(copy, 'card-place', [item.district, item.block, item.community]);
    addPropertyTags(copy, item);
    addPropertyPrices(copy, item);
  } else {
    addLine(copy, 'card-meta', [item.district, item.block, item.buildingPeriod]);
    addMarketPrice(copy, item);
  }
  card.append(buildCover(item, kind), copy);
  if (isHouse) {
    card.setAttribute('role', 'link');
    card.tabIndex = 0;
    card.setAttribute('aria-label', '查看' + title + '的三方房源详情');
    const explain = () => {
      const toast = document.getElementById('detail-toast');
      toast.textContent = '正式产品将打开' + (item.source || '对应三方平台') + '的这套房源详情';
      toast.hidden = false;
      clearTimeout(explain.timer);
      explain.timer = setTimeout(() => { toast.hidden = true; }, 2600);
    };
    card.addEventListener('click', explain);
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); explain(); }
    });
  }
  return card;
}

function addRecommendations(floor, kind, items) {
  const visibleCount = 3;
  const initial = node('div', 'recommendations');
  initial.append(...items.slice(0, visibleCount).map(item => recommendation(kind, item)));
  floor.append(initial);
  if (items.length <= visibleCount) return;

  const extra = node('div', 'more-recommendations');
  extra.id = floor.id + '-more';
  extra.hidden = true;
  extra.append(...items.slice(visibleCount).map(item => recommendation(kind, item)));
  const toggle = node('button', 'more-button', '查看更多');
  toggle.type = 'button';
  toggle.setAttribute('aria-controls', extra.id);
  toggle.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', () => {
    const expand = extra.hidden;
    extra.hidden = !expand;
    toggle.textContent = expand ? '收起' : '查看更多';
    toggle.setAttribute('aria-expanded', String(expand));
    if (!expand) toggle.scrollIntoView({ block: 'nearest' });
  });
  floor.append(extra, toggle);
}

const viewer = document.getElementById('viewer');
const viewerContent = viewer.querySelector('.viewer-content');
let openedAssetRef;
let viewerItems = [], viewerIndex = 0, viewerKind = '图片';
viewer.querySelector('.viewer-close').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
viewer.addEventListener('close', () => {
  openedAssetRef = undefined;
  viewerContent.replaceChildren();
});

function stepViewer(delta) {
  const next=viewerIndex+delta;
  if(next<0||next>=viewerItems.length)return;
  viewerIndex=next;
  showViewerItem();
}
document.getElementById('viewer-prev').addEventListener('click',()=>stepViewer(-1));
document.getElementById('viewer-next').addEventListener('click',()=>stepViewer(1));
let viewerTouchStart=null;
viewer.addEventListener('touchstart',event=>{viewerTouchStart={x:event.changedTouches[0].clientX,y:event.changedTouches[0].clientY}},{passive:true});
viewer.addEventListener('touchend',event=>{if(!viewerTouchStart)return;const dx=event.changedTouches[0].clientX-viewerTouchStart.x,dy=event.changedTouches[0].clientY-viewerTouchStart.y;const delta=viewerKind==='图片'?dx:dy;if(Math.abs(delta)>45)stepViewer(delta<0?1:-1);viewerTouchStart=null},{passive:true});
viewer.addEventListener('keydown',event=>{if(viewerKind==='图片'&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();stepViewer(event.key==='ArrowRight'?1:-1)}if(viewerKind==='视频'&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();stepViewer(event.key==='ArrowDown'?1:-1)}});
function openMedia(kind, item, items) {
  if (isMediaDisabled(item.assetRef)) return;
  viewerKind=kind;
  viewerItems=items.filter(value=>!isMediaDisabled(value.assetRef));
  viewerIndex=Math.max(0,viewerItems.indexOf(item));
  if(!viewer.open)viewer.showModal();
  showViewerItem();
}
function showViewerItem(){
  const item=viewerItems[viewerIndex],kind=viewerKind;
  if(!item)return;
  openedAssetRef = item.assetRef;
  const url = fileUrl(item.cover);
  const isVideo = kind === '视频';
  const content = node(isVideo ? 'video' : 'img');
  function showError() {
    viewerContent.textContent = isVideo ? '视频暂时无法播放，请稍后再试' : '照片暂时无法查看，请稍后再试';
  }
  content.addEventListener('error', showError, { once: true });
  if (isVideo) {
    content.controls = true;
    content.autoplay = true;
    content.playsInline = true;
    if (url && !url.startsWith('blob:')) content.poster = url;
    content.src = item.video || (url.startsWith('blob:') ? url : 'sample.mp4');
  } else {
    if (!url) { showError(); return; }
    content.alt = item.title || '实景照片';
    content.src = url;
  }
  viewerContent.replaceChildren(content);
  document.getElementById('viewer-count').textContent=(viewerIndex+1)+' / '+viewerItems.length;
  document.getElementById('viewer-prev').disabled=viewerIndex===0;
  document.getElementById('viewer-next').disabled=viewerIndex===viewerItems.length-1;
  document.getElementById('viewer-hint').textContent=viewerItems.length>1?(isVideo?'上下滑动查看其他视频':'左右滑动查看其他照片'):'';
}

function mediaTile(kind, item, items) {
  const isVideo = kind === '视频';
  const button = node('button', 'media-card');
  button.type = 'button';
  button.setAttribute('aria-label', isVideo ? '播放视频' : '查看照片');
  const cover = buildCover(item, kind);
  if (isVideo) cover.append(node('span', 'play'));
  button.append(cover);
  button.addEventListener('click', () => openMedia(kind, item, items));
  return button;
}

function addMediaFloor(floor, kind, items) {
  const initialCount = kind === '图片' ? 2 : 1;
  const initial = node('div', 'media-grid');
  initial.append(...items.slice(0, initialCount).map(item => mediaTile(kind, item, items)));
  floor.append(initial);
  if (items.length <= initialCount) return;
  const extra = node('div', 'media-grid more-recommendations');
  extra.id = floor.id + '-more';
  extra.hidden = true;
  extra.append(...items.slice(initialCount).map(item => mediaTile(kind, item, items)));
  const label = kind === '图片' ? '照片' : '视频';
  const toggle = node('button', 'more-button', '查看全部' + label + '（' + items.length + '）');
  toggle.type = 'button';
  toggle.setAttribute('aria-controls', extra.id);
  toggle.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', () => {
    const expand = extra.hidden;
    extra.hidden = !expand;
    toggle.textContent = expand ? '收起' + label : '查看全部' + label + '（' + items.length + '）';
    toggle.setAttribute('aria-expanded', String(expand));
    if (!expand) initial.scrollIntoView({ block: 'nearest' });
  });
  floor.append(extra, toggle);
}

function renderFloor(kind) {
  if(document.body.dataset.snapshotDisabled==='1')return;
  const media = kind === '图片' || kind === '视频';
  const items = sampleReport ? sampleReport.items[kind] || [] : fromReport
    ? (Array.isArray(titles[kind]) ? titles[kind] : []).map((title, index) => ({
        ...(details[kind]?.[index] || {}),
        title: String(title),
        cover: covers[kind]?.[index],
        assetRef: media ? details[kind]?.[index]?.assetRef || ReportPrototype.referenceForName(String(title)) : undefined
      }))
    : demo[kind];
  const visibleItems = media ? items.filter(item => !isMediaDisabled(item.assetRef)) : items;
  const description = typeof descriptions[kind] === 'string' ? descriptions[kind].trim() : '';
  const existing = document.getElementById(floors[kind].id);
  if (!visibleItems.length && !description) {
    existing?.remove();
    return;
  }

  const floor = node('section', 'floor');
  floor.id = floors[kind].id;
  floor.append(node('h2', 'floor-title', typeof moduleTitles[kind] === 'string' && moduleTitles[kind].trim() ? moduleTitles[kind].trim() : floors[kind].title));
  if (description) floor.append(node('p', 'floor-desc', description));
  if (visibleItems.length) {
    if (!media) {
      addRecommendations(floor, kind, visibleItems);
    } else {
      addMediaFloor(floor, kind, visibleItems);
    }
  }
  if (existing) existing.replaceWith(floor);
  else {
    const after = reportOrder.slice(reportOrder.indexOf(kind) + 1)
      .map(type => document.getElementById(floors[type].id)).find(Boolean);
    main.insertBefore(floor, after || null);
  }
}

function renderEmptyState() {
  main.querySelector('.page-error')?.remove();
  if (!main.childElementCount) main.append(node('p', 'page-error', '这份报告暂时没有可查看的内容'));
}
if(document.body.dataset.snapshotDisabled!=='1') for (const kind of reportOrder) renderFloor(kind);
renderEmptyState();
ReportPrototype.onAvailabilityChange(() => {
  if (viewer.open && isMediaDisabled(openedAssetRef)) {
    viewerContent.replaceChildren();
    viewer.close();
  }
  for (const kind of reportOrder) {
    if (kind === '图片' || kind === '视频') renderFloor(kind);
  }
  renderEmptyState();
});

const reportTitle = sampleReport?.title || params.get('title')?.trim() || (fromReport ? '专属报告' : '西安三房看房参考');
document.getElementById('report-title').textContent = reportTitle;
document.title = reportTitle;
const advisorName=sampleReport?.advisorName||params.get('advisorName')?.trim()||(!fromReport?'林悦':'');
if(advisorName){const advisor=document.getElementById('report-advisor');advisor.textContent='安家顾问 '+advisorName+'为您整理';advisor.hidden=false}
const heroHouses = reportOrder.includes('房源') ? sampleReport ? sampleReport.items.房源 || [] : fromReport
  ? (Array.isArray(titles.房源) ? titles.房源 : []).map((_,index)=>details.房源?.[index]||{}) : demo.房源 : [];
if (heroHouses.length) {
  const format = value => new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(value);
  const range = (values,unit) => {const nums=values.map(Number).filter(value=>Number.isFinite(value)&&value>0).sort((a,b)=>a-b);return nums.length?(nums[0]===nums.at(-1)?format(nums[0]):format(nums[0])+'–'+format(nums.at(-1)))+unit:''};
  const rooms=[...new Set(heroHouses.map(house=>Number(house.room)).filter(Boolean))].sort((a,b)=>a-b).map(room=>room+'室').join(' / ');
  const line=[heroHouses.length+'套房源',range(heroHouses.map(house=>house.area),'㎡'),rooms].filter(Boolean).join(' · ');
  const price=range(heroHouses.map(house=>house.price),'万');
  const summary=document.getElementById('hero-house-summary');
  summary.append(node('span','',line));
  if(price)summary.append(node('strong','','总价 '+price));
  summary.hidden=false;
}
const returnButton = document.querySelector('.return-button');
if (window.opener || (document.referrer && history.length > 1)) {
  returnButton.hidden = false;
  returnButton.addEventListener('click', () => { if (window.opener) window.close(); else history.back(); });
}
if (document.body.dataset.snapshotDisabled === '1') {
  document.querySelector('.report').classList.add('is-unavailable');
  document.getElementById('report-content').innerHTML = '<div class="unavailable-state" role="status"><div class="unavailable-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M11 8h19l7 7v24a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M29 8v8h8M15 24h16M15 30h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m13 35 20-20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div><h2>该报告暂不可查看</h2><p>这份资料目前无法查看，请返回会话查看其他内容。</p></div>';
  document.title = '报告暂不可查看';
}
</script>
